# ============================================================
# 站点配置：mc.sh197.dpdns.org
# HTTP 80 -> 站点 + Let's Encrypt 验证
# HTTPS 443 -> 站点（自签或正式证书）
# 反代目标：web:3000 (Node.js 后台)
# ============================================================

# ---------- HTTP 80 ----------
server {
    listen 80;
    server_name mc.sh197.dpdns.org;

    # certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查
    location = /health {
        proxy_pass http://web:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余请求转发到 Web 后台
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# ---------- HTTPS 443 ----------
server {
    listen 443 ssl http2;
    server_name mc.sh197.dpdns.org;

    # 证书：certbot 复制到 /etc/nginx/certs/
    ssl_certificate     /etc/nginx/certs/live/mc.sh197.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/mc.sh197.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 健康检查
    location = /health {
        proxy_pass http://web:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 下载中心（大文件，关闭缓冲提升速度）
    location /downloads/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # 其余请求
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
