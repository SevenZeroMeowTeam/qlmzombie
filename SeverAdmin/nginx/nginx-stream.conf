# ============================================================
# MC TCP 统一转发：玩家连接 mc.sh197.dpdns.org:25565 直达 MC 服务器
# ============================================================
stream {
    # 健康检查上游（可选）
    upstream mc_backend {
        server qlm-minecraft:25565;
    }

    server {
        listen 25565;
        proxy_pass mc_backend;
        proxy_timeout 600s;
        proxy_connect_timeout 10s;
    }
}
