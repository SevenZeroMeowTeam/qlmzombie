# ============================================================
# MC TCP 多入口统一转发：玩家连接 mc.sh197.dpdns.org:<端口> 直达 MC 服务器
#   - 主入口  : 25565 → qlm-minecraft:25565（对应 .env NGINX_MC_PORT 宿主映射）
#   - 额外入口: stream-extra.conf（由 deploy.sh 按 .env MC_EXTRA_PORTS 自动生成）
#              支持多个入口端口分别指向不同后端/中转节点，按地区选择最近入口降低延迟
# 低延迟调优:
#   - tcp_nodelay on            禁用 Nagle 算法，小数据包即时发送（MC 数据包延迟关键）
#   - proxy_socket_keepalive on 保持与上游的 TCP 存活探测，避免假死重连
# 注意: stream 的 keepalive（上游连接池）是 NGINX Plus 付费功能，开源 nginx 不支持，
#       配置会报 "keepalive directive is not allowed here"，故不启用。
# ============================================================
stream {
    # 主后端
    upstream mc_backend {
        server qlm-minecraft:25565;
    }

    # 主入口（容器内监听 25565，宿主端口由 .env NGINX_MC_PORT 映射）
    server {
        listen 25565;
        proxy_pass mc_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 600s;
        proxy_socket_keepalive on;
        tcp_nodelay on;
    }

    # RCON 管理入口（外部监控工具连 mc.sh197.dpdns.org:25575，宿主端口由 .env RCON_NGINX_PORT 映射）
    upstream rcon_backend {
        server qlm-minecraft:25575;
    }
    server {
        listen 25575;
        proxy_pass rcon_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 600s;
        proxy_socket_keepalive on;
        tcp_nodelay on;
    }

    # 额外多入口（多重转发 · 降低延迟）
    include /etc/nginx/conf.d/stream-extra.conf;
}
