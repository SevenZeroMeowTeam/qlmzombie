modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="七零喵僵尸末日生存mod"
authors="QLM Team"
# 允许任何客户端版本（包括 vanilla 无 Forge 客户端）连接服务器
# 这使得 mineflayer/外部 AI bot 可以作为 vanilla 客户端连接
acceptableRemoteVersions = "*"
description='''
七零喵僵尸末日生存mod - 按天数推进难度（1-25和平/26-50简单/51-100普通/101-150困难锁定/151+极限锁定）。
血月每14天一次，随机幸运月/丰收月，僵尸随机进化，AI智能优化，
尸潮系统，Boss三阶段战斗，建筑宝箱随机武器装备。
经验条样式血量UI，计分板HUD，连锁挖矿/砍树。
v2.10.0.b37 镐子随机能力系统：合成镐子有概率获得黑曜石破坏者(15%)/3x3(10%)/5x5(5%)范围挖掘，可叠加。
v2.10.0.b36 新增 Crafting Dead 末日装备系统：42+ 物品（8枪/7弹/13附件/3近战/3手雷/4防具/2方块）
+ 3 僵尸变种（军人/科学家/平民）+ 4 创意标签页，全部 cd_ 前缀，forge DeferredRegister 注册。
v1.8.0: 集成AdvancedSkillsRe开局5技能点，武器检测JSON配置化，代码重构优化，异常日志完善。
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

